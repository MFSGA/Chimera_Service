[workspace]
resolver = "2"
members = [
    "chimera_service",
    "chimera_ipc",
    "crates/clash-api",
    "crates/nyanpasu-core-manager",
    "crates/nyanpasu-core-metadata",
    "crates/nyanpasu-utils",
    "crates/chimera-utils",
    "crates/chimera-core-metadata",
    "crates/chimera-clash-api",
    "crates/chimera-core-manager",
]

[workspace.package]
edition = "2024"
license = "GPL-3.0"
authors = ["zzzgydi", "LibNyanpasu"]
repository = "https://github.com/MFSGA/Chimera_Service"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }

nyanpasu-utils = { git = "https://github.com/LibNyanpasu/nyanpasu-utils.git", default-features = false }

chimera_utils = { git = "https://github.com/MFSGA/Chimera_Utils.git", default-features = false }

# The service manager uses the Chimera implementations of the reference
# utility and core-manager crates. The platform package remains the source of
# shared CoreType identity used by IPC and application code.
chimera-utils = { path = "crates/chimera-utils", default-features = false }
chimera-platform-utils = { package = "chimera_utils", git = "https://github.com/MFSGA/Chimera_Utils.git", default-features = false }
serde_yaml_ng = { version = "0.10", git = "https://github.com/libnyanpasu/serde-yaml-ng.git", rev = "363da138dc97f90ef0a356f971c2dc1d8fe04c9e", features = ["specta"] }
reqwest = { version = "0.13", default-features = false, features = [
    "charset",
    "http2",
    "system-proxy",
    "json",
    "query",
    "stream",
    "rustls",
] }

axum = "0.8"

thiserror = "2"
anyhow = "1"

clap = { version = "4", features = ["derive"] }

tracing = "0.1"
tracing-attributes = "0.1"
tracing-subscriber = { version = "0.3", features = [
    "env-filter",
    "json",
    "parking_lot",
] }
tracing-log = { version = "0.2" }
tracing-appender = { version = "0.2", features = ["parking_lot"] }
serde = { version = "1", features = ["derive"] }

futures-util = "0.3"

windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_SystemServices",
    "Win32_System_Pipes",
    "Win32_System_Threading",
    "Win32_Storage_FileSystem",
] }

simd-json = "0.18"
chrono = { version = "0.4", features = ["serde"] }

[profile.release]
panic = "unwind"
codegen-units = 1
lto = true
opt-level = "s"
