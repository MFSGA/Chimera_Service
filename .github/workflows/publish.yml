name: Publish

on:
  workflow_dispatch:

permissions:
  contents: write
  discussions: write

jobs:
  publish:
    name: Validate and create draft release
    outputs:
      version: ${{ steps.release-version.outputs.version }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
      - name: Install Rust nightly toolchain
        run: |
          rustup toolchain install -c clippy -c rustfmt --profile minimal nightly
          rustup default nightly

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - uses: Swatinem/rust-cache@v2
        name: Setup Rust cache
        with:
          shared-key: ${{ runner.os }}-ci
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - id: release-version
        shell: bash
        name: Validate release version
        run: |
          SERVICE_VERSION=$(deno run --allow-read .github/scripts/get-version.ts --path ./chimera_service/Cargo.toml | head -n 1)
          IPC_VERSION=$(deno run --allow-read .github/scripts/get-version.ts --path ./chimera_ipc/Cargo.toml | head -n 1)
          test -n "$SERVICE_VERSION"
          test "$SERVICE_VERSION" = "$IPC_VERSION"
          if git ls-remote --exit-code --tags origin "refs/tags/v$SERVICE_VERSION" >/dev/null 2>&1; then
            echo "tag v$SERVICE_VERSION already exists" >&2
            exit 1
          fi
          echo "version=$SERVICE_VERSION" >> "$GITHUB_OUTPUT"
          echo "Validated runtime version v$SERVICE_VERSION"
      - name: Check formatting
        run: cargo +nightly fmt --all -- --check
      - name: Test release workspace
        run: cargo +nightly test --workspace --locked -- --test-threads=1
      - name: Verify clean release tree
        shell: bash
        run: test -z "$(git status --porcelain)"
      - name: Create draft release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          name: Chimera Service v${{ steps.release-version.outputs.version }}
          tag_name: "v${{ steps.release-version.outputs.version }}"
          target_commitish: ${{ github.sha }}
  release_macos:
    needs: [publish]
    name: Release v${{ needs.publish.outputs.version }} for macOS
    strategy:
      matrix:
        profile:
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.profile.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: v${{ needs.publish.outputs.version }}
      - name: Install coreutils for macOS
        run: brew install coreutils
      - name: Install Rust toolchain and target toolchain
        run: rustup toolchain install nightly --profile minimal && rustup target add ${{ matrix.profile.target }} --toolchain nightly
      - name: Build
        run: cargo +nightly build --release --target ${{ matrix.profile.target }}
      - name: Archive
        run: |
          mkdir -p target/release
          cp target/${{ matrix.profile.target }}/release/chimera-service target/release/chimera-service
          cd target/release
          tar -czf chimera-service-${{ matrix.profile.target }}.tar.gz ./chimera-service
          cd ../..
          mv target/release/chimera-service-${{ matrix.profile.target }}.tar.gz .
      - name: Calc the archive signature
        run: sha256sum chimera-service-${{ matrix.profile.target }}.tar.gz > chimera-service-${{ matrix.profile.target }}.tar.gz.sha256
      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ needs.publish.outputs.version }}"
          files: |
            chimera-service-${{ matrix.profile.target }}.tar.gz
            chimera-service-${{ matrix.profile.target }}.tar.gz.sha256
  release_linux:
    needs: [publish]
    name: Release v${{ needs.publish.outputs.version }} for ${{ matrix.profile.target }}
    strategy:
      matrix:
        profile:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - os: ubuntu-latest
            target: i686-unknown-linux-gnu
          - os: ubuntu-latest
            target: i686-unknown-linux-musl
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
          #- os: ubuntu-latest
          #  target: armv7-unknown-linux-gnueabi
          #- os: ubuntu-latest
          #  target: armv7-unknown-linux-musleabi
          #- os: ubuntu-latest
          #  target: armv7-unknown-linux-musleabihf
          #- os: ubuntu-latest
          #  target: armv7-unknown-linux-gnueabihf
    runs-on: ${{ matrix.profile.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: v${{ needs.publish.outputs.version }}
      - name: Install Rust toolchain and target toolchain
        run: rustup toolchain install nightly --profile minimal && rustup target add ${{ matrix.profile.target }} --toolchain nightly
      - name: Setup Cross
        if: contains(matrix.profile.target, 'musl')
        run: |
          curl -L --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/cargo-bins/cargo-binstall/main/install-from-binstall-release.sh | bash
          cargo binstall cross -y
      - uses: goto-bus-stop/setup-zig@v2
        name: Setup Zig
        if: contains(matrix.profile.target, 'musl') == false
      - name: Setup Cargo zigbuild
        if: contains(matrix.profile.target, 'musl') == false
        run: |
          curl -L --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/cargo-bins/cargo-binstall/main/install-from-binstall-release.sh | bash
          cargo binstall cargo-zigbuild -y
      - name: Build
        if: contains(matrix.profile.target, 'musl') == false
        run: cargo +nightly zigbuild --release --target ${{ matrix.profile.target }}
      - name: Build with Cross
        if: contains(matrix.profile.target, 'musl')
        run: cross +nightly build --release --target ${{ matrix.profile.target }}
      - name: Archive
        run: |
          mkdir -p target/release
          cp target/${{ matrix.profile.target }}/release/chimera-service target/release/chimera-service
          cd target/release
          tar -czf chimera-service-${{ matrix.profile.target }}.tar.gz ./chimera-service
          cd ../..
          mv target/release/chimera-service-${{ matrix.profile.target }}.tar.gz .
      - name: Calc the archive signature
        run: sha256sum chimera-service-${{ matrix.profile.target }}.tar.gz > chimera-service-${{ matrix.profile.target }}.tar.gz.sha256
      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ needs.publish.outputs.version }}"
          files: |
            chimera-service-${{ matrix.profile.target }}.tar.gz
            chimera-service-${{ matrix.profile.target }}.tar.gz.sha256
  release_windows:
    needs: [publish]
    name: Release v${{ needs.publish.outputs.version }} for ${{ matrix.profile.target }}
    strategy:
      matrix:
        profile:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: windows-latest
            target: aarch64-pc-windows-msvc
          - os: windows-latest
            target: i686-pc-windows-msvc
    runs-on: ${{ matrix.profile.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: v${{ needs.publish.outputs.version }}
      - name: Install Rust toolchain and target toolchain
        run: rustup toolchain install nightly --profile minimal && rustup target add ${{ matrix.profile.target }} --toolchain nightly
      - name: Build
        run: cargo +nightly build --release --target ${{ matrix.profile.target }}
      - name: Archive
        run: |
          New-Item -ItemType Directory -Force -Path target\release
          Copy-Item target\${{ matrix.profile.target }}\release\chimera-service.exe target\release\chimera-service.exe
          Set-Location target\release
          Compress-Archive -Path chimera-service.exe -DestinationPath ..\..\chimera-service-${{ matrix.profile.target }}.zip
          Set-Location ..\..
      - name: Calc the archive signature
        shell: pwsh
        run: Get-FileHash chimera-service-${{ matrix.profile.target }}.zip -Algorithm SHA256 | Format-List > chimera-service-${{ matrix.profile.target }}.zip.sha256
      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ needs.publish.outputs.version }}"
          files: |
            chimera-service-${{ matrix.profile.target }}.zip
            chimera-service-${{ matrix.profile.target }}.zip.sha256

  publish_release:
    name: Publish release candidate
    needs: [publish, release_macos, release_linux, release_windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish prerelease candidate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: v${{ needs.publish.outputs.version }}
        run: gh release edit "$RELEASE_TAG" --draft=false --prerelease --repo "${{ github.repository }}"
